services:
  app:
    container_name: apmatia-app
    build:
      context: .
      args:
        OFFLINE_DEPS: ${APMATIA_OFFLINE:-0}
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - ${HOME}/.apmatia/workspace:${HOME}/.apmatia/workspace
      - ${HOME}/.apmatia:${HOME}/.apmatia
      - ${HOME}/.config/apmatia:${HOME}/.config/apmatia
      - ${HOME}/.local/share/apmatia:${HOME}/.local/share/apmatia
    environment:
      - HOME=${HOME}
      - APMATIA_HOME=${HOME}/.apmatia
      - APMATIA_DATA_DIR=${HOME}/.local/share/apmatia
      - APMATIA_WORKSPACE_ROOT=${HOME}/.apmatia/workspace/modules
      - APMATIA_SERVER_HOST=0.0.0.0
      - APMATIA_SERVER_TRANSPORT_SECURITY_CONTAINER_HOST_LOOPBACK_ONLY=true

  streamlit:
    container_name: apmatia-streamlit
    build:
      context: .
      args:
        OFFLINE_DEPS: ${APMATIA_OFFLINE:-0}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - ${HOME}/.apmatia/workspace:${HOME}/.apmatia/workspace
      - ${HOME}/.apmatia:${HOME}/.apmatia
      - ${HOME}/.config/apmatia:${HOME}/.config/apmatia
      - ${HOME}/.local/share/apmatia:${HOME}/.local/share/apmatia
    environment:
      - HOME=${HOME}
      - APMATIA_HOME=${HOME}/.apmatia
      - APMATIA_DATA_DIR=${HOME}/.local/share/apmatia
      - APMATIA_WORKSPACE_ROOT=${HOME}/.apmatia/workspace/modules
      - MODE=streamlit
      - APMATIA_STREAMLIT_HOST=0.0.0.0
      - APMATIA_SERVER_TRANSPORT_SECURITY_CONTAINER_HOST_LOOPBACK_ONLY=true
    ports:
      - "127.0.0.1:8501:8501"
