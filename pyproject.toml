[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apmatia"
version = "0.0.1.7"
description = "A modular, registry-driven AI application platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "flet",
    "python-dotenv",
    "streamlit==1.58.0",
    "uvicorn",
]

[project.scripts]
apmatia = "apmatia.interfaces.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["apmatia*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.toml"]

[tool.pytest.ini_options]
pythonpath = ["."]
exclude = ["docs/vendor/*"]
